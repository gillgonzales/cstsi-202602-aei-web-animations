<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>CSTI-4SEM-LPAW-Aula 02 | CSS3 Animação: Exemplo 05</title>
        <meta name="description" content="  ">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
            body{
                display: flex;
                flex-direction: row;
                align-items: center;
                justify-content: center;
            }
            
            :root{
                --sprite-y: -180px
            }

            div{
                /*https://i.ibb.co/rdb23sk/goblin-big.png*/
                /*background-image: url('https://i.ibb.co/YWHGhYN/goblin_big.png');*/
                background-image: url('https://i.ibb.co/rdb23sk/goblin-big.png');
                background-size: 480px 730px;
                width:160px;
                height: 180px;
                background-repeat: no-repeat;
                background-clip: content-box;
                background-position: 0px var(--sprite-y);
                animation-name: div-sprite;
                animation-duration:1s;
                animation-iteration-count: infinite;
                animation-timing-function: step-end;
                animation-direction: reverse;
                /* animation-play-state: paused; */
            }
            
            @keyframes div-sprite{
                 0%,100%{background-position: 0px var(--sprite-y);transform: translateY(0px);}
                 25%{background-position: -170px var(--sprite-y);transform: translateY(20px);}
                 50%{background-position: -330px var(--sprite-y);transform: translateY(40px);}
                 75%{background-position: -170px var(--sprite-y);transform: translateY(80px);}
            }
            
            img {
                width: 160px;
                height: 180px;
                object-fit: none;
                object-position: 40% 90%;
                animation-name: img-sprite;
                animation-duration:1s;
                animation-iteration-count: infinite;
                animation-timing-function: step-end;
              }
              
              @keyframes img-sprite{
                  0%,100%{object-position: 0% 67%;transform: translateX(0px);}
                  25%{object-position: 50% 67%;transform: translateX(50px);}
                  50%{object-position: 100% 67%;transform: translateX(100px);}
              }
        </style>
    </head>
    <body>
        <div></div>
        <img src="https://i.ibb.co/rdb23sk/goblin-big.png" alt="Globin">
    </body>
</html>
